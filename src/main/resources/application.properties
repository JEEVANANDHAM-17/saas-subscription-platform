spring.application.name=jeevanandham.subscription
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=jdbc:mysql://localhost:3306/subscription_app?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234

# Let Spring Data JPA/Hibernate create and update the tables from the entities.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Preserve entity field names as database column names (for example, SubscriptionID).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT signing secret must be a Base64-encoded value containing at least 32 random bytes.
# Local-development fallback only; always set JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.jwt.issuer=${JWT_ISSUER:https://api.jeevanandham.subscription}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT1H}
#this jwt access token generated by gpt