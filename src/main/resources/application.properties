spring.application.name=jeevanandham.subscription
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=jdbc:mysql://localhost:3306/subscription_app?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234

# Let Spring Data JPA/Hibernate create and update the tables from the entities.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Preserve entity field names as database column names (for example, SubscriptionID).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
